<style>:root {
  color-scheme: light;
  --navy: #102b4d;
  --blue: #005ac4;
  --paper: #fff;
  --bg: #eef4fb;
  --muted: #435b75;
  --border: #cfdced;
  --teal: #006e68;
  --good: #156047;
  --bad: #8e390f;
  font: 18px/1.6 "Times New Roman", Georgia, serif;
  color: var(--navy);
  background: var(--bg);
}
* { box-sizing: border-box; }
body { margin: 0; }
#lesson-root { max-width: 930px; padding: clamp(12px, 4vw, 36px); margin: auto; }
h1, h2, h3, p { margin: 0 0 .65rem; overflow-wrap: anywhere; }
h1 { font-size: clamp(1.8rem, 4.8vw, 2.85rem); line-height: 1.1; }
h2 { font-size: 1.45rem; line-height: 1.24; }
h3 { font-size: 1.13rem; line-height: 1.28; }
ul { padding-left: 1.3rem; }
.hero {
  color: #fff;
  padding: clamp(20px, 5vw, 38px);
  border-radius: 18px;
  background: linear-gradient(115deg,#102b4d,#005bc4 88%);
  box-shadow: 0 9px 22px #123d6c25;
}
.hero p { max-width: 65ch; margin-bottom: 0; color: #eef6ff; }
.eyebrow, .meta, button, select, input, .steps, .small, .badge {
  font: 500 .84rem/1.4 system-ui, sans-serif;
}
.eyebrow { margin-bottom: .65rem !important; }
.toolbar, .actions, .model-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.toolbar { justify-content: space-between; padding: 12px 0; gap: 6px 12px; }
.meta, .small { color: var(--muted); }
.panel, .model { background: var(--paper); border: 1px solid var(--border); border-radius: 15px; }
.panel { padding: clamp(14px, 3.5vw, 28px); margin: 14px 0; box-shadow: 0 4px 10px #112d4c0a; }
.model { margin: 14px 0; padding: 15px; background: #f7faff; }
.model-output { display: block; color: var(--teal); font-weight: bold; margin: .5rem 0; }
.model-controls { margin: .4rem 0; }
.model-controls label { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
button, input:not([type=checkbox]):not([type=radio]), select {
  border: 1px solid #9fb5cf; background: #fff; color: var(--navy); border-radius: 9px;
  min-height: 44px; padding: 8px 12px;
}
button { cursor: pointer; font-weight: 650; }
button:hover:not(:disabled) { background: #e5f1ff; }
button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
button.primary:hover:not(:disabled) { background: #004ca6; }
button:disabled { opacity: .5; cursor: default; }
button[aria-pressed=true] { background: #dcecff; border-color: var(--blue); }
:focus-visible { outline: 3px solid #1b72d3; outline-offset: 3px; }
input[type=radio], input[type=checkbox] { accent-color: var(--blue); width: 18px; height: 18px; }
input.answer { width: min(100%, 280px); font-size: 1rem; }
input[type=range] { padding: 0 !important; max-width: 170px; }
.steps { display: flex; flex-wrap: wrap; gap: 7px; }
.steps span { border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; }
.steps [aria-current=step] { background: #d6eaff; border-color: #7eafe5; font-weight: 700; }
.feedback { border-left: 4px solid var(--blue); background: #eaf3ff; padding: 12px; margin: 12px 0; }
.feedback:empty { display: none; }
.feedback[data-state=good] { border-color: var(--good); color: var(--good); background: #e7f6ef; }
.feedback[data-state=bad] { border-color: var(--bad); color: #763112; background: #fff2e7; }
.question { margin: 12px 0; }
.options { display: grid; gap: 8px; margin: .65rem 0; }
.option { display: flex; gap: 9px; align-items: center; min-height: 44px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; cursor: pointer; }
.option:has(input:checked) { background: #e3efff; border-color: #8fb5df; }
.option span { overflow-wrap: anywhere; min-width: 0; }
.order-list { margin: 10px 0; padding-left: 1.5rem; }
.order-list li { margin-bottom: 5px; }
.option-group, .history-row { border: 0; padding: 0; margin: 0; min-width: 0; }
.history-row { border-top: 1px solid var(--border); padding: 9px 0; }
.history-row summary { cursor: pointer; }
canvas { width: min(100%, 460px); height: auto; display: block; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: .45rem 0; }
.badge { padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.badge.mark { border-color: #83b9e6; color: #064c96; background: #e1f0ff; }
.result { font: 750 clamp(1.8rem,6vw,2.8rem)/1.15 system-ui,sans-serif; color: var(--teal); }
.source { padding: 8px 2px; }
a { color: #0054b6; }
[hidden] { display: none !important; }
@media(max-width: 440px) {
  .actions button { flex: 1 1 auto; }
  .steps { gap: 4px; }
  .steps span { padding: 3px 7px; }
}
</style>

<script>
"use strict";
function element(tag, text, attrs = {}) {
  const el = document.createElement(tag);
  if (text != null) el.textContent = text;
  for (const [key, val] of Object.entries(attrs)) el.setAttribute(key, val);
  return el;
}

const range = (from, to) => Array.from({length: to-from+1}, (_,i) => i+from);
const gcd = (a, b) => b ? gcd(b,a%b) : Math.abs(a);
const lcm = (a,b) => a*b/gcd(a,b);

function factor(n) {
  const factors = [];
  for (let d=2; d*d<=n; d++) {
    while (n%d===0) {
      factors.push(d);
      n /= d;
    }
  }
  if (n>1) factors.push(n);
  return factors;
}

// Parse the four operations, parentheses and powers. No evaluation of code.
function calculate(input) {
  const source = input.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-').replace(/\s/g,'');
  if (source.length>45 || !/^[\d()+*\/^.-]+$/.test(source)) throw Error('Kiểm tra biểu thức.');
  const tokens = source.match(/\d+(?:\.\d+)?|[()+*\/^.-]/g) || [];
  let i=0;
  const peek=()=>tokens[i];
  function atom() {
    if (peek()==='(') {
      i++;
      const value=sum();
      if (tokens[i++]!==')') throw Error('Thiếu dấu ngoặc đóng.');
      return value;
    }
    const t=tokens[i++];
    if (!t || !/^\d+(?:\.\d+)?$/.test(t)) throw Error('Kiểm tra số và phép tính.');
    return Number(t);
  }
  function signed() {
    if (peek()==='-') { i++; return -signed(); }
    const base=atom();
    if (peek()!=='^') return base;
    i++;
    return base ** signed();
  }
  function product() {
    let a=signed();
    while (peek()==='*' || peek()==='/') {
      const op=tokens[i++];
      const b=signed();
      if (op==='/' && b===0) throw Error('Không chia được cho 0.');
      a=op==='*' ? a*b : a/b;
    }
    return a;
  }
  function sum() {
    let a=product();
    while (peek()==='+' || peek()==='-') {
      const op=tokens[i++];
      const b=product();
      a=op==='+' ? a+b : a-b;
    }
    return a;
  }
  const result=sum();
  if (i!==tokens.length || !Number.isFinite(result)) throw Error('Biểu thức ngoài phạm vi máy mô phỏng.');
  return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:8}).format(result);
}

function makeModel(kind, onSave) {
  const box=element('section',null,{class:'model','aria-label':'Mô hình khám phá'});
  const controls=element('div',null,{class:'model-controls'});
  const visual=element('div');
  const output=element('output',null,{class:'model-output','aria-live':'polite'});
  const memo=element('p','',{class:'small','aria-live':'polite'});
  const state={};
  const titles={
    set:'Thử thay điều kiện của tập hợp', place:'Bảng giá trị theo hàng', line:'Di chuyển trên trục số',
    sum:'Thử ghép hai số cho tròn trăm', groups:'Xếp thành nhóm đều', power:'Thử đổi cơ số và số mũ',
    digits:'Kiểm tra dấu hiệu chia hết', factor:'Tách thừa số nguyên tố', gcd:'Thử chia thành các nhóm',
    lcm:'Tìm mốc cùng lặp', sign:'Lật dấu các thẻ trong ngoặc', product:'Kiểm tra dấu của tích và thương',
    regular:'Quan sát đa giác đều', quadrilateral:'Quan sát các đường chéo', area:'Đo đường bao và phần phủ',
    axis:'Phản xạ qua trục', center:'Quay quanh tâm', symmetry:'So sánh phản xạ và quay',
    room:'Đo phòng và cửa lấy sáng', construct:'Dựng hình trên lưới mô phỏng', calc:'Máy tính mô phỏng'
  };
  box.append(element('h3',titles[kind]),controls,visual,output);
  function slider(key,label,min,max,value) {
    state[key]=value;
    const input=element('input',null,{type:'range',min,max,value});
    const live=element('span',String(value));
    const wrapper=element('label',label+' ');
    wrapper.append(input,live);
    controls.append(wrapper);
    input.addEventListener('input',()=>{
      state[key]=Number(input.value);
      live.textContent=input.value;
      update();
    });
  }
  function select(key,label,values) {
    state[key]=values[0];
    const input=element('select');
    for (const value of values) input.append(element('option',value));
    const wrapper=element('label',label+' ');
    wrapper.append(input);
    controls.append(wrapper);
    input.addEventListener('change',()=>{ state[key]=input.value; update(); });
  }
  function integer(key,label,value,min,max) {
    state[key]=value;
    const input=element('input',null,{type:'number',min,max,value});
    input.style.width='100px';
    const wrapper=element('label',label+' ');
    wrapper.append(input);
    controls.append(wrapper);
    input.addEventListener('input',()=>{
      if (input.value && input.validity.valid) { state[key]=Number(input.value); update(); }
    });
  }
  function pills(values,marked=()=>false) {
    const line=element('div',null,{class:'pills'});
    values.forEach(v=>line.append(element('span',v,{class:'badge'+(marked(v)?' mark':'')})));
    visual.replaceChildren(line);
  }
  function drawing(label, draw) {
    const canvas=element('canvas',label,{width:460,height:210,role:'img','aria-label':label});
    visual.replaceChildren(canvas);
    const c=canvas.getContext('2d');
    if (!c) return;
    c.scale(1,1);
    for (let x=10; x<460; x+=20) {
      c.beginPath(); c.strokeStyle='#dfeaf6'; c.moveTo(x,0); c.lineTo(x,210); c.stroke();
    }
    for (let y=5; y<210; y+=20) {
      c.beginPath(); c.moveTo(0,y); c.lineTo(460,y); c.stroke();
    }
    const line=(a,b,color='#1364ab',dash=[])=>{
      c.beginPath(); c.strokeStyle=color; c.lineWidth=2; c.setLineDash(dash); c.moveTo(...a); c.lineTo(...b); c.stroke(); c.setLineDash([]);
    };
    const polygon=(pts)=>{
      c.beginPath(); c.moveTo(...pts[0]); pts.slice(1).forEach(p=>c.lineTo(...p)); c.closePath();
      c.fillStyle='#a9d3ff80'; c.fill(); c.strokeStyle='#0057ac'; c.lineWidth=2; c.stroke();
    };
    const dot=(p,label,color='#075aa4')=>{
      c.beginPath(); c.arc(...p,5,0,2*Math.PI); c.fillStyle=color; c.fill(); c.font='bold 15px system-ui'; c.fillText(label,p[0]+7,p[1]-7);
    };
    draw({c,line,polygon,dot});
  }
  function regular(n,r=75,ox=230,oy=105,angle=-Math.PI/2) {
    return range(0,n-1).map(i=>[ox+r*Math.cos(angle+2*Math.PI*i/n),oy+r*Math.sin(angle+2*Math.PI*i/n)]);
  }
  switch(kind) {
    case 'set': slider('n','Giới hạn n',1,9,5); select('sign','Điều kiện',['x < n','x ≤ n']); break;
    case 'place': integer('n','Số tự nhiên',4072,0,99999); break;
    case 'line': slider('a','Điểm đầu',-8,8,-4); slider('b','Số bước',-4,4,3); break;
    case 'sum': slider('a','Số hạng thứ nhất',20,80,36); slider('b','Số hạng thứ hai',20,80,54); break;
    case 'groups': slider('n','Số vật',8,48,26); slider('b','Mỗi nhóm',2,10,4); break;
    case 'power': slider('a','Cơ số',2,6,3); slider('b','Số mũ',0,5,3); break;
    case 'digits': integer('n','Số cần kiểm tra',315,0,99999); break;
    case 'factor': slider('n','Số cần phân tích',2,120,45); break;
    case 'gcd': slider('a','Số thứ nhất',2,40,18); slider('b','Số thứ hai',2,40,24); break;
    case 'lcm': slider('a','Chu kì thứ nhất',2,12,4); slider('b','Chu kì thứ hai',2,12,6); break;
    case 'sign': select('sign','Dấu trước ngoặc',['+','−']); slider('a','Độ lớn số hạng đầu',1,9,5); slider('b','Độ lớn số hạng sau',1,9,3); break;
    case 'product': slider('a','Số thứ nhất',-9,9,-4); slider('b','Số thứ hai',-9,9,3); break;
    case 'regular': select('shape','Đa giác đều',['Tam giác','Hình vuông','Lục giác']); break;
    case 'quadrilateral': select('shape','Hình',['Chữ nhật','Thoi','Bình hành','Thang cân']); select('diag','Đường chéo',['Hiện','Ẩn']); break;
    case 'area': slider('a','Chiều dài',2,12,6); slider('b','Chiều rộng',2,8,4); break;
    case 'room': slider('a','Chiều dài phòng (m)',3,9,6); slider('b','Chiều rộng phòng (m)',3,8,5); slider('c','Diện tích lấy sáng (m²)',1,12,6); break;
    case 'axis': case 'center': case 'symmetry':
      select('transform','Phép thử',kind==='axis'?['Gập qua trục dọc','Gập qua trục ngang']:kind==='center'?['Quay 180°']:['Gập qua trục dọc','Gập qua trục ngang','Quay 180°']);
      slider('a','Vị trí ngang của P',-4,4,3); slider('b','Vị trí dọc của P',-3,3,2); break;
    case 'construct':
      select('shape','Công cụ',['Đoạn thẳng','Đường thẳng','Đường tròn tâm A qua B','Tam giác đều','Hình vuông','Lục giác đều']);
      slider('a','Vị trí ngang của B',2,6,3); slider('b','Vị trí dọc của B',-2,2,0); break;
    case 'calc': {
      const input=element('input',null,{type:'text',maxlength:'45','aria-label':'Biểu thức trên máy tính',value:'6 × (7 + 2)'});
      const keys=element('div',null,{class:'actions'});
      controls.append(input,keys);
      for (const key of ['7','8','9','÷','4','5','6','×','1','2','3','−','0','(',')','+','^','Xóa','=']) {
        const button=element('button',key,{type:'button'});
        keys.append(button);
        button.onclick=()=>{
          if (key==='Xóa') { input.value=''; output.textContent=''; }
          else if (key==='=') {
            try { output.textContent=calculate(input.value); }
            catch(e) { output.textContent=e.message; }
            state.expression=input.value;
          } else if (input.value.length<45) input.value+=key;
        };
        if (key==='=') input.addEventListener('keydown',e=>{ if(e.key==='Enter') {e.preventDefault();button.click();} });
      }
      break;
    }
  }

  function update() {
    const {n,a,b,c,shape,transform,sign}=state;
    switch(kind) {
      case 'set': {
        const bound=sign==='x < n' ? n-1 : n;
        pills(range(0,10),x=>x<=bound);
        output.textContent='A = {'+range(0,bound).join(', ')+'}';
        break;
      }
      case 'place': {
        const digits=String(n).split('').map(Number);
        pills(digits.map((d,i)=>d+' × '+10**(digits.length-i-1)));
        output.textContent='Giá trị các chữ số: '+digits.map((d,i)=>d*10**(digits.length-i-1)).join(' + ');
        break;
      }
      case 'line':
        drawing('Trục số. Điểm đầu '+a+', điểm cuối '+(a+b),({line,dot,c})=>{
          const x=n=>230+n*16;
          line([18,110],[442,110]);
          range(-12,12).forEach(n=>{
            line([x(n),104],[x(n),116]);
            if(n%2===0){ c.fillStyle='#375678'; c.font='12px system-ui'; c.fillText(n,x(n)-7,137); }
          });
          dot([x(a),110],'Đầu'); dot([x(a+b),82],'Cuối','#006d58');
          line([x(a),82],[x(a+b),82],'#006d58');
        });
        output.textContent=a+' + ('+b+') = '+(a+b);
        break;
      case 'sum':
        pills([a,b,a+b],n=>n===100);
        output.textContent=a+' + '+b+' = '+(a+b)+'. Để được 100, số đi cùng '+a+' là '+(100-a)+'.';
        break;
      case 'groups': {
        const full=Math.floor(n/b),rest=n%b;
        pills([...range(1,full).map(()=>String(b)),...(rest?['Dư '+rest]:[])],x=>x===String(b));
        output.textContent=n+' = '+b+' × '+full+' + '+rest;
        break;
      }
      case 'power':
        pills(b ? Array(b).fill(String(a)) : ['Số mũ 0']);
        output.textContent=a+' mũ '+b+' = '+a**b;
        break;
      case 'digits': {
        const ds=String(n).split('').map(Number);
        const total=ds.reduce((u,v)=>u+v,0);
        pills(ds.map(String));
        output.textContent='Tổng chữ số '+total+'. '+n+' chia hết cho: '+([2,3,5,9].filter(k=>n%k===0).join(', ')||'không số nào trong 2, 3, 5, 9')+'.';
        break;
      }
      case 'factor': {
        const parts=factor(n);
        pills(parts.map(String));
        output.textContent=n+' = '+parts.join(' × ')+(parts.length===1?' (số nguyên tố)':' (hợp số)');
        break;
      }
      case 'gcd': {
        const common=range(1,Math.min(a,b)).filter(x=>a%x===0 && b%x===0);
        pills(common,x=>x===gcd(a,b));
        output.textContent='ƯCLN('+a+', '+b+') = '+gcd(a,b);
        break;
      }
      case 'lcm': {
        const both=lcm(a,b);
        const times=range(1,Math.min(both,24)).filter(x=>x%a===0||x%b===0);
        pills(times.map(x=>x+' s'),x=>x===both+' s');
        output.textContent='Hai chu kì '+a+' s và '+b+' s trùng lần đầu sau '+both+' s.';
        break;
      }
      case 'sign':
        pills(sign==='+'?['+'+a,'−'+b]:['−'+a,'+'+b]);
        output.textContent='0 '+sign+' ('+a+' − '+b+') = '+(sign==='+'?a-b:b-a);
        break;
      case 'product':
        output.textContent=a+' × ('+b+') = '+a*b+(b?' · Thử phép chia ngược: '+(a*b)+' : ('+b+') = '+a:'. Phép chia cho 0 không xác định.');
        break;
      case 'regular': {
        const count={'Tam giác':3,'Hình vuông':4,'Lục giác':6}[shape];
        drawing(shape+' đều',({polygon,line})=>{
          const pts=regular(count,75,230,105,count===4?-Math.PI/4:-Math.PI/2);
          polygon(pts);
          pts.forEach(p=>line([230,105],p,'#00806a',[4,4]));
        });
        output.textContent=count+' cạnh bằng nhau · Góc ở đỉnh '+((count-2)*180/count)+'°.';
        break;
      }
      case 'quadrilateral': {
        const pts={
          'Chữ nhật':[[140,50],[320,50],[320,160],[140,160]],
          'Thoi':[[230,35],[320,105],[230,175],[140,105]],
          'Bình hành':[[170,50],[340,50],[290,160],[120,160]],
          'Thang cân':[[165,55],[295,55],[340,155],[120,155]]
        }[shape];
        drawing('Hình '+shape.toLowerCase(),({polygon,line,dot})=>{
          polygon(pts);
          if(state.diag==='Hiện'){ line(pts[0],pts[2],'#007764',[5,4]); line(pts[1],pts[3],'#007764',[5,4]); }
          pts.forEach((p,i)=>dot(p,'ABCD'[i]));
        });
        output.textContent='So sánh độ dài và góc tạo bởi AC, BD khi chuyển hình.';
        break;
      }
      case 'area': case 'room': {
        drawing('Hình chữ nhật '+a+' nhân '+b,({polygon,line})=>{
          const x=130,y=28,u=19;
          polygon([[x,y],[x+a*u,y],[x+a*u,y+b*u],[x,y+b*u]]);
          for(let i=1;i<a;i++)line([x+i*u,y],[x+i*u,y+b*u],'#74a8d7');
          for(let j=1;j<b;j++)line([x,y+j*u],[x+a*u,y+j*u],'#74a8d7');
        });
        output.textContent=kind==='area'?'Chu vi '+2*(a+b)+' đơn vị · Diện tích '+a*b+' đơn vị vuông.':
          'Sàn '+a*b+' m² · Tỉ số cửa/sàn '+(100*c/(a*b)).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%.';
        break;
      }
      case 'axis': case 'center': case 'symmetry': {
        const x=transform==='Gập qua trục ngang'?a:-a;
        const y=transform==='Gập qua trục dọc'?b:-b;
        drawing('P ('+a+', '+b+'); ảnh P phẩy ('+x+', '+y+')',({line,dot})=>{
          if(transform==='Gập qua trục dọc')line([230,10],[230,200],'#006a5d',[5,4]);
          if(transform==='Gập qua trục ngang')line([60,105],[400,105],'#006a5d',[5,4]);
          if(transform==='Quay 180°')dot([230,105],'O');
          dot([230+a*20,105-b*20],'P'); dot([230+x*20,105-y*20],'P′','#006a5d');
        });
        output.textContent='P ('+a+'; '+b+') → P′ ('+x+'; '+y+'). Dấu dương theo hướng sang phải và lên trên.';
        break;
      }
      case 'construct': {
        const p=[182,112],q=[182+a*22,112-b*22];
        drawing('A và B trên lưới, hình dựng bằng công cụ '+shape,({c,line,dot,polygon})=>{
          const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);
          if(shape==='Đường tròn tâm A qua B'){
            c.beginPath(); c.strokeStyle='#0057ac'; c.lineWidth=2; c.arc(...p,len,0,2*Math.PI);c.stroke();
          } else if(shape==='Đường thẳng') {
            line([p[0]-4*dx,p[1]-4*dy],[p[0]+5*dx,p[1]+5*dy]);
          } else if(shape==='Đoạn thẳng') line(p,q);
          else {
            const count={'Tam giác đều':3,'Hình vuông':4,'Lục giác đều':6}[shape];
            const pts=[p,q];
            const turn=2*Math.PI/count;
            const dir=Math.atan2(dy,dx);
            for(let i=1;i<count-1;i++){
              const prev=pts.at(-1);
              pts.push([prev[0]+len*Math.cos(dir-turn*i),prev[1]+len*Math.sin(dir-turn*i)]);
            }
            const extent=Math.max(...pts.map(([x,y])=>Math.max(Math.abs(x-230)/208,Math.abs(y-105)/91)));
            const scale=Math.min(1,1/extent);
            polygon(pts.map(([x,y])=>[230+(x-230)*scale,105+(y-105)*scale]));
            dot([230+(p[0]-230)*scale,105+(p[1]-105)*scale],'A');
            dot([230+(q[0]-230)*scale,105+(q[1]-105)*scale],'B');
            return;
          }
          dot(p,'A'); dot(q,'B');
        });
        output.textContent='Công cụ: '+shape+'. Độ dài AB = '+Math.hypot(a,b).toLocaleString('vi-VN',{maximumFractionDigits:2})+' đơn vị lưới.';
        break;
      }
    }
  }
  update();
  const save=element('button','Lưu quan sát',{type:'button'});
  save.onclick=()=>{
    if(!output.textContent) {memo.textContent='Hãy thực hiện một phép tính trước.';return;}
    onSave(output.textContent);
    memo.textContent='Đã thêm quan sát vào lịch sử lượt này.';
  };
  box.append(save,memo);
  return box;
}

const lesson = JSON.parse(document.querySelector('#lesson-data').textContent);
const root = document.querySelector('#lesson-root');
const CHANNEL = 'taydo.edu.lesson.v1';
const VERSION = '1.0';
const questionById = new Map([
  ...lesson.skills.flatMap(s => [s.probe,s.practice,s.transfer]),
  ...lesson.quiz
].map(q => [q.id,q]));

let profile = null;
let embeddedAccount = false;
let syncLabel = '';
let current = null;
let historyVisible = false;
let memory = [];
let storageError = false;
const standaloneKey = 'taydo-edu-profile-v1';
const pending = new Map();

function storageKey() {
  return 'taydo-edu-history-v1:'+lesson.id+':'+profile;
}
function readHistory() {
  if (!profile) return [];
  try {
    const stored = localStorage.getItem(storageKey());
    return stored ? JSON.parse(stored) : memory;
  } catch (_) {
    storageError = true;
    return memory;
  }
}
function writeHistory(records) {
  memory = records;
  try { localStorage.setItem(storageKey(),JSON.stringify(records)); }
  catch (_) { storageError = true; }
}
function mergeHistory(records) {
  const byId = new Map(readHistory().map(r=>[r.id,r]));
  for (const record of records) {
    const known = byId.get(record.id);
    if (!known || record.revision>known.revision || (
      record.revision===known.revision && record.updatedAt>known.updatedAt
    )) byId.set(record.id,record);
  }
  writeHistory([...byId.values()].sort((a,b)=>b.startedAt.localeCompare(a.startedAt)));
}
function updateSyncLabel() {
  const label = document.querySelector('#storage-label');
  if (!label) return;
  label.textContent = embeddedAccount
    ? syncLabel
    : storageError ? 'Trình duyệt đang chặn lưu trên thiết bị. Hãy tải lịch sử trước khi đóng trang.'
    : 'Lịch sử lưu trên trình duyệt này';
}
function send(type, payload={}) {
  if (window.parent!==window && location.origin!=='null') {
    window.parent.postMessage({channel:CHANNEL,type,lessonId:lesson.id,...payload},location.origin);
  }
}
function syncRecord(record) {
  if (!embeddedAccount) return;
  pending.set(record.id,record.revision);
  syncLabel = 'Đang đồng bộ lịch sử…';
  send('save',{record,userId:profile.slice('account:'.length)});
  updateSyncLabel();
}
function save() {
  current.revision++;
  current.updatedAt = new Date().toISOString();
  mergeHistory([current]);
  syncRecord(current);
  updateSyncLabel();
}
function log(kind, values) {
  current.events.push({kind,at:new Date().toISOString(),...values});
}
function validRecord(r) {
  return r && r.lessonId===lesson.id && typeof r.id==='string'
    && Number.isInteger(r.revision) && typeof r.startedAt==='string'
    && typeof r.updatedAt==='string' && Array.isArray(r.events);
}

window.addEventListener('message',event=>{
  if (event.source!==window.parent || event.origin!==location.origin || window.parent===window) return;
  const data=event.data;
  if (!data || data.channel!==CHANNEL || data.lessonId!==lesson.id) return;
  if (data.type==='account' && typeof data.userId==='string') {
    const key='account:'+data.userId;
    const changed=profile!==key || !embeddedAccount;
    if (changed) { current=null; memory=[]; pending.clear(); profile=key; historyVisible=false; }
    embeddedAccount=true;
    syncLabel='Đang tải lịch sử tài khoản…';
    if(changed) render();
    updateSyncLabel();
    return;
  }
  if (data.type==='signed-out' && embeddedAccount) {
    embeddedAccount=false;
    profile=null;
    current=null;
    memory=[];
    pending.clear();
    render();
    return;
  }
  if (!embeddedAccount || profile!=='account:'+data.userId) return;
  if (data.type==='history') {
    const remote=(Array.isArray(data.records)?data.records:[]).filter(validRecord);
    const remoteById=new Map(remote.map(r=>[r.id,r.revision]));
    mergeHistory(remote);
    for(const local of readHistory()) {
      if(local.revision>(remoteById.get(local.id)||0)) syncRecord(local);
    }
    syncLabel = pending.size ? 'Đang đồng bộ lịch sử…' : 'Lịch sử tài khoản đã đồng bộ';
    if (!current || historyVisible) render();
    updateSyncLabel();
  }
  if (data.type==='saved') {
    if ((pending.get(data.id)||0)<=data.revision) pending.delete(data.id);
    syncLabel = pending.size ? 'Đang đồng bộ lịch sử…' : 'Lịch sử tài khoản đã đồng bộ';
    updateSyncLabel();
  }
  if (data.type==='sync-error') {
    syncLabel = storageError ? 'Chưa đồng bộ. Hãy tải lịch sử trước khi đóng trang.'
      : 'Chưa đồng bộ. Đã giữ bản trên thiết bị này.';
    updateSyncLabel();
  }
});
window.addEventListener('online',()=>send('hello'));
window.addEventListener('storage',e=>{
  if(profile && e.key===storageKey() && (!current || historyVisible)) render();
});

function dateLabel(value) {
  return new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(new Date(value));
}
function action(text, handler, primary=false) {
  const btn=element('button',text,{type:'button',class:primary?'primary':''});
  btn.onclick=handler;
  return btn;
}
function focusMain() {
  const title=root.querySelector('main h2');
  if(title) { title.tabIndex=-1; title.focus({preventScroll:true}); title.scrollIntoView({block:'nearest'}); }
}
function renderThenFocus() { render(); focusMain(); }

function newAttempt(skillIndex) {
  const isReview=Number.isInteger(skillIndex);
  const now=new Date().toISOString();
  const id=typeof crypto.randomUUID==='function'?crypto.randomUUID():[
    ...crypto.getRandomValues(new Uint8Array(16))
  ].map(n=>n.toString(16).padStart(2,'0')).join('').replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/,'$1-$2-$3-$4-$5');
  current={
    id,lessonId:lesson.id,version:VERSION,startedAt:now,updatedAt:now,
    revision:0,status:'in_progress',score:null,total:isReview?0:lesson.quiz.length,
    mode:isReview?'review':'lesson',reviewSkill:isReview?lesson.skills[skillIndex].id:null,
    step:{phase:isReview?'lab':'probe',index:isReview?skillIndex:0,part:isReview?'study':'question',feedback:null},
    events:[]
  };
  save();
  historyVisible=false;
  renderThenFocus();
}
function reopen(record) {
  current=structuredClone(record);
  historyVisible=false;
  renderThenFocus();
}
function backToLesson() {
  current=null;
  historyVisible=false;
  renderThenFocus();
}
function shuffleOptions(q) {
  const salt=current.id+q.id;
  let seed=2166136261;
  for (const char of salt) seed=Math.imul(seed^char.charCodeAt(0),16777619)>>>0;
  const list=q.options.map((_,i)=>i);
  for(let i=list.length-1;i>0;i--) {
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    const j=seed%(i+1);
    [list[i],list[j]]=[list[j],list[i]];
  }
  if(q.mode==='order' && list.every((n,i)=>n===i)) list.push(list.shift());
  return list;
}
function matches(q,value) {
  if(q.mode==='multi') return value.length===q.answer.length && q.answer.every(x=>value.includes(x));
  if(q.mode==='order') return q.answer.every((x,i)=>value[i]===x) && value.length===q.answer.length;
  return value===q.answer;
}
function answerText(q,value) {
  if(q.mode==='number') return String(value);
  return (Array.isArray(value)?value:[value]).map(i=>q.options[i]).join(q.mode==='order'?' → ':', ');
}
function mistake(q,value) {
  const goal=lesson.skills.find(s=>s.id===q.skill);
  if(lesson.id==='toan_6_c1_b1' && q.id==='m1-practice') {
    if(value.includes(4)) return {code:'boundary',hint:'Em đã chọn 4. Hãy thử thay x = 4 vào x < 4. Mệnh đề 4 < 4 đúng hay sai?'};
    if(!value.includes(0)) return {code:'omitted_zero',hint:'Tập số tự nhiên có chứa 0. Hãy kiểm tra 0 có nhỏ hơn 4 không.'};
  }
  return {code:q.skill||'application',hint:goal?.hint||''};
}
function submitQuestion(q,value) {
  const step=current.step;
  if(step.feedback) return;
  const right=matches(q,value);
  const phase=step.phase==='lab' ? step.part : step.phase;
  const seen=current.events.filter(e=>e.kind==='answer' && e.qid===q.id).length;
  const hint = phase==='practice' && !right && seen===0;
  const issue=right?null:mistake(q,value);
  log('answer',{qid:q.id,skill:q.skill,phase,response:value,correct:right,number:seen+1,
    errorCode:issue?.code||null,prompt:q.prompt,responseText:answerText(q,value)});
  if(hint) log('hint',{qid:q.id,skill:q.skill,phase,errorCode:issue.code,text:issue.hint});
  step.feedback={right,hint,response:value,hintText:hint?issue.hint:null};
  save();
  render();
  document.querySelector('#question-feedback')?.focus({preventScroll:true});
}
function nextAfter(q) {
  const step=current.step;
  if (step.phase==='probe') {
    if (++step.index===lesson.skills.length) {step.phase='lab';step.index=0;step.part='study';}
  } else if(step.phase==='lab') {
    if(step.part==='study') step.part='practice';
    else if(step.part==='practice' && step.feedback?.hint) step.part='practice';
    else if(step.part==='practice') step.part='transfer';
    else if(current.mode==='review') {
      current.status='completed';
      current.completedAt=new Date().toISOString();
      step.phase='result';
    }
    else if (++step.index===lesson.skills.length) {step.phase='quiz';step.index=0;step.part='question';}
    else step.part='study';
  } else if(step.phase==='quiz') {
    if (++step.index===lesson.quiz.length) {
      const answers=current.events.filter(e=>e.kind==='answer' && e.phase==='quiz');
      current.score=answers.filter(a=>a.correct).length;
      current.status='completed';
      current.completedAt=new Date().toISOString();
      step.phase='result';
    }
  }
  step.feedback=null;
  save();
  renderThenFocus();
}
function drawQuestion(parent,q,graded) {
  const panel=element('section',null,{class:'question'});
  const form=element('form');
  const group=element('fieldset',null,{class:'option-group'});
  group.append(element('legend',q.prompt,{class:'question-title'}));
  panel.append(form);
  form.append(group);
  parent.append(panel);
  const snapshot=current.step.feedback;
  if(snapshot) {
    const chosen=element('p','Em đã chọn: '+answerText(q,snapshot.response),{class:'small'});
    const skill=lesson.skills.find(s=>s.id===q.skill);
    let feedback='Đã ghi nhận câu trả lời.';
    if(!graded && current.step.phase==='probe') feedback='Đã ghi nhận câu trả lời. Em sẽ khám phá cách làm ở phần tiếp theo.';
    else if(!graded && snapshot.hint) feedback='Gợi ý: '+(snapshot.hintText||skill.hint);
    else if(!graded) feedback=(snapshot.right?'Chính xác. ':'Cùng xem cách làm. ')+q.explanation;
    const banner=element('p',feedback,{class:'feedback',id:'question-feedback',tabindex:'-1',role:'status'});
    if(!graded && current.step.phase!=='probe') banner.dataset.state=snapshot.right?'good':'bad';
    group.append(chosen,banner);
    const text = snapshot.hint ? 'Thử lại nhiệm vụ'
      : graded && current.step.index===lesson.quiz.length-1 ? 'Xem kết quả'
      : current.step.phase==='lab' && current.step.part==='practice' ? 'Làm câu mới' : 'Tiếp tục';
    form.append(action(text,()=>nextAfter(q),true));
    return;
  }
  let read;
  const error=element('p','',{class:'feedback',role:'status','data-state':'bad'});
  if(q.mode==='number') {
    const field=element('input',null,{class:'answer',type:'text',inputmode:'text',
      autocomplete:'off',maxlength:'18','aria-label':'Nhập đáp án dạng số nguyên',placeholder:'Nhập đáp án'});
    group.append(element('p','Chỉ nhập số nguyên, có thể dùng dấu âm.',{class:'small'}),field);
    read=()=>{
      const val=field.value.trim().replace(/^−/,'-');
      return /^[+-]?\d+$/.test(val) && Number.isSafeInteger(Number(val)) ? Number(val) : null;
    };
  } else if(q.mode==='order') {
    let order=[];
    const ordered=element('ol',null,{class:'order-list','aria-label':'Thứ tự đã chọn'});
    const buttons=element('div',null,{class:'actions'});
    const source=shuffleOptions(q);
    const controls=source.map(i=>{
      const btn=action(q.options[i],()=>{
        order.push(i);drawOrder();
        const next=controls.find(b=>!b.disabled);
        (next||submit).focus();
      });
      btn.dataset.option=String(i);
      return btn;
    });
    function drawOrder() {
      ordered.replaceChildren(...order.map(i=>element('li',q.options[i])));
      controls.forEach(btn=>btn.disabled=order.includes(Number(btn.dataset.option)));
    }
    buttons.append(...controls);
    const clear=action('Xóa thứ tự',()=>{order=[];drawOrder();controls[0].focus();});
    group.append(element('p','Bấm các thẻ theo thứ tự. Dùng “Xóa thứ tự” nếu muốn làm lại.',{class:'small'}),buttons,ordered,clear);
    read=()=>order.length===source.length?order.slice():null;
  } else {
    const options=element('div',null,{class:'options'});
    if(q.mode==='multi')group.append(element('p','Chọn tất cả đáp án đúng.',{class:'small'}));
    for(const i of shuffleOptions(q)) {
      const label=element('label',null,{class:'option'});
      label.append(element('input',null,{type:q.mode==='multi'?'checkbox':'radio',name:'answer',value:i}),
                   element('span',q.options[i]));
      options.append(label);
    }
    group.append(options);
    read=()=>{
      const selected=[...group.querySelectorAll('input:checked')].map(el=>Number(el.value));
      if(!selected.length) return null;
      return q.mode==='multi'?selected:selected[0];
    };
  }
  const submit=element('button',graded?'Ghi đáp án':'Gửi câu trả lời',{type:'submit',class:'primary'});
  form.append(error,submit);
  form.onsubmit=event=>{
    event.preventDefault();
    const value=read();
    if(value===null) {error.textContent='Hãy hoàn thành câu trả lời trước khi gửi.';return;}
    submitQuestion(q,value);
  };
}

function downloadHistory() {
  const rows=readHistory();
  const file=new Blob([JSON.stringify({schema:CHANNEL,lessonId:lesson.id,exportedAt:new Date().toISOString(),attempts:rows},null,2)],
    {type:'application/json'});
  const href=URL.createObjectURL(file);
  const link=element('a',null,{href,download:lesson.id+'-lich-su.json'});
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(href),1000);
}
function renderHistory(panel) {
  panel.append(element('h2','Lịch sử từng lượt làm'));
  const records=readHistory();
  if(!records.length) {panel.append(element('p','Em chưa có lượt làm nào trong bài này.'));return;}
  panel.append(action('Tải lịch sử JSON',downloadHistory));
  for(const r of records) {
    const details=element('details',null,{class:'history-row'});
    const info=r.mode==='review' ? (r.status==='completed'?'Đã ôn theo mục tiêu':'Đang ôn theo mục tiêu')
      : r.status==='completed'?r.score+'/'+r.total+' câu đúng':'Đang làm';
    details.append(element('summary',dateLabel(r.startedAt)+' · '+info+' · '+r.events.filter(e=>e.kind==='answer').length+' câu trả lời đã ghi'));
    if(r.status==='in_progress' && r.version===VERSION)details.append(action('Tiếp tục lượt này',()=>reopen(r),true));
    for(const e of r.events) {
      if(e.kind==='answer') {
        const q=questionById.get(e.qid);
        if(!q && !e.prompt)continue;
        const phase={probe:'Khởi động',practice:'Khám phá',transfer:'Câu mới',quiz:'Tự kiểm tra'}[e.phase]||e.phase;
        const result=e.phase==='quiz' && r.status!=='completed'?'Đã ghi':e.correct?'Đúng':'Sai';
        details.append(element('p',dateLabel(e.at)+' · '+phase+' · '+(e.prompt||q.prompt)+' → '+(e.responseText||answerText(q,e.response))+' ('+result+')',{class:'small'}));
      }
      if(e.kind==='hint')details.append(element('p',e.text?'Gợi ý đã hiện: '+e.text:'Đã hiện gợi ý cho câu vừa trả lời.',{class:'small'}));
      if(e.kind==='observation')details.append(element('p','Quan sát đã lưu: '+e.text,{class:'small'}));
    }
    panel.append(details);
  }
}
function renderResult(panel) {
  if(current.mode==='review') {
    const skill=lesson.skills.find(s=>s.id===current.reviewSkill);
    const check=current.events.find(e=>e.phase==='transfer' && e.kind==='answer');
    panel.append(element('h2','Kết quả ôn theo mục tiêu'),element('h3',skill.title),
      element('p',check?.correct?'Em đã trả lời đúng câu mới.':'Câu mới cần luyện thêm. Xem cách giải rồi thử lại.'),
      element('p',skill.transfer.explanation));
    const controls=element('div',null,{class:'actions'});
    controls.append(action('Ôn lại mục tiêu này',()=>newAttempt(lesson.skills.indexOf(skill)),true),
      action('Xem lịch sử',()=>{historyVisible=true;renderThenFocus();}));
    panel.append(controls);
    return;
  }
  panel.append(element('h2','Kết quả tự kiểm tra'),element('p',current.score+' / '+current.total,{class:'result'}),
    element('p','Số câu đúng ở lượt làm này. Em có thể xem cách giải rồi quay lại luyện.'));
  const checked=current.events.filter(e=>e.kind==='answer' && e.phase==='quiz');
  const list=element('ul');
  for(const skill of lesson.skills) {
    const transfer=current.events.find(e=>e.kind==='answer' && e.qid===skill.transfer.id);
    const test=checked.find(e=>e.skill===skill.id);
    const status = test?.correct ? 'Câu cuối bài đúng' : 'Nên luyện thêm';
    const item=element('li',skill.title+' — '+status+(transfer?' · Câu mới '+(transfer.correct?'đúng':'chưa đúng'):''));
    if(!test?.correct) {
      const more=element('details');
      more.append(element('summary','Xem lại quy tắc và ví dụ'),element('p',skill.rule),element('p',skill.example));
      item.append(more,action('Ôn mục tiêu này',()=>newAttempt(lesson.skills.indexOf(skill))));
    }
    list.append(item);
  }
  panel.append(list);
  for(const a of checked) {
    const q=questionById.get(a.qid);
    const d=element('details',null,{class:'history-row'});
    d.append(element('summary',(a.correct?'Đúng · ':'Xem lại · ')+q.prompt),
      element('p','Em trả lời: '+answerText(q,a.response)),element('p','Đáp án: '+answerText(q,q.answer)),
      element('p',q.explanation));
    panel.append(d);
  }
  const controls=element('div',null,{class:'actions'});
  controls.append(action('Bắt đầu lượt mới',newAttempt,true),action('Xem lịch sử',()=>{historyVisible=true;renderThenFocus();}));
  panel.append(controls);
}
function renderStudy(panel) {
  const step=current.step;
  const skill=lesson.skills[step.index];
  if(step.phase==='probe') {
    panel.append(element('h2','Khởi động '+(step.index+1)+' / '+lesson.skills.length));
    drawQuestion(panel,skill.probe,false);
    return;
  }
  if(step.phase==='quiz') {
    panel.append(element('h2','Tự kiểm tra '+(step.index+1)+' / '+lesson.quiz.length));
    drawQuestion(panel,lesson.quiz[step.index],true);
    return;
  }
  if(step.phase==='result') {renderResult(panel);return;}
  panel.append(element('h2',skill.title));
  if(step.part==='study') {
    const first=current.events.find(e=>e.qid===skill.probe.id && e.kind==='answer');
    if(first && !first.correct) panel.append(element('p','Từ câu khởi động: '+skill.hint,{class:'feedback'}));
    panel.append(element('p',skill.rule),element('h3','Ví dụ có lời giải'),element('p',skill.example));
    if(step.index===0)panel.append(makeModel(lesson.model,text=>{
      if(current.events.filter(e=>e.kind==='observation').length>=25) {
        const firstIndex=current.events.findIndex(e=>e.kind==='observation');
        current.events.splice(firstIndex,1);
      }
      log('observation',{text});
      save();
    }));
    panel.append(action('Thử một nhiệm vụ',()=>nextAfter(),true));
  } else {
    panel.append(element('p',step.part==='transfer'?'Câu mới cùng mục tiêu':'Nhiệm vụ khám phá',{class:'small'}));
    drawQuestion(panel,skill[step.part],false);
  }
}

function renderStart(panel) {
  panel.append(element('h2','Mục tiêu bài học'));
  const ul=element('ul');
  for(const skill of lesson.skills)ul.append(element('li',skill.title));
  panel.append(ul);
  if(!profile) {
    const form=element('form');
    const label=element('label','Mã học trên thiết bị này ');
    const input=element('input',null,{maxlength:'32',required:'',placeholder:'Ví dụ: 6A-07',autocomplete:'off'});
    label.append(input);
    const submit=element('button','Chọn mã học',{class:'primary',type:'submit'});
    form.append(label,submit);
    panel.append(element('p','Dùng cùng một mã trên trình duyệt này để xem lại các lượt đã làm.',{class:'small'}),form);
    form.onsubmit=e=>{
      e.preventDefault();
      const value=input.value.trim();
      if(!value) return;
      profile='device:'+value.toLocaleLowerCase('vi');
      memory=[];
      try {localStorage.setItem(standaloneKey,profile);}
      catch(_) {storageError=true;}
      renderThenFocus();
    };
    return;
  }
  const controls=element('div',null,{class:'actions'});
  const inProgress=readHistory().find(r=>r.status==='in_progress' && r.version===VERSION);
  if(inProgress)controls.append(action('Tiếp tục lượt gần nhất',()=>reopen(inProgress),true));
  controls.append(action('Bắt đầu lượt mới',newAttempt,!inProgress));
  panel.append(controls);
}
function render() {
  root.replaceChildren();
  const hero=element('header',null,{class:'hero'});
  hero.append(element('p','Tây Đô Smart EDU · Toán 6 · Tập một',{class:'eyebrow'}),
    element('h1',lesson.title),element('p',lesson.intro));
  root.append(hero);
  const toolbar=element('div',null,{class:'toolbar'});
  toolbar.append(element('span','',{id:'storage-label',class:'meta','aria-live':'polite'}));
  const actions=element('div',null,{class:'actions'});
  if(profile) {
    if(embeddedAccount && syncLabel.startsWith('Chưa đồng bộ')) actions.append(action('Đồng bộ lại',()=>send('hello')));
    actions.append(action(historyVisible?'Quay lại bài':'Lịch sử',()=>{historyVisible=!historyVisible;renderThenFocus();}));
    if(current && !historyVisible)actions.append(action('Về đầu bài',backToLesson));
    if(!embeddedAccount)actions.append(action('Đổi mã học',()=>{
      try {localStorage.removeItem(standaloneKey);} catch(_) {storageError=true;}
      profile=null;memory=[];current=null;historyVisible=false;renderThenFocus();
    }));
  }
  toolbar.append(actions);
  root.append(toolbar);
  const step=current?.step?.phase;
  if(current && !historyVisible) {
    const steps=element('nav',null,{class:'steps','aria-label':'Tiến trình bài'});
    for(const [key,name] of [['probe','Khởi động'],['lab','Khám phá và sửa sai'],['quiz','Tự kiểm tra'],['result','Kết quả']]) {
      steps.append(element('span',name,key===step?{'aria-current':'step'}:{}));
    }
    root.append(steps);
  }
  const panel=element('main',null,{class:'panel'});
  root.append(panel);
  if(historyVisible && profile)renderHistory(panel);
  else if(current)renderStudy(panel);
  else renderStart(panel);
  root.append(element('footer','Tham chiếu SGK Toán 6 Kết nối tri thức với cuộc sống, tập một, trang '+lesson.page+'.',{class:'small source'}));
  updateSyncLabel();
}
try {
  const saved=localStorage.getItem(standaloneKey);
  if(saved?.startsWith('device:'))profile=saved;
} catch (_) {storageError=true;}
render();
send('hello');
if (window.parent!==window) {
  const retry=setInterval(()=>{ if(!embeddedAccount)send('hello'); },1500);
  setTimeout(()=>clearInterval(retry),15000);
}

</script>
